# Google App Engine configuration (alternative to Cloud Run)
runtime: python311

entrypoint: gunicorn --bind :$PORT --workers 2 --threads 4 main:app

instance_class: F2

automatic_scaling:
  min_instances: 0
  max_instances: 5
  target_cpu_utilization: 0.65

handlers:
  - url: /static
    static_dir: app/static
    secure: always

  - url: /.*
    script: auto
    secure: always
