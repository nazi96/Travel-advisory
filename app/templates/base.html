<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}World Travel Advisory{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container header-flex">
            <a href="{{ url_for('main.home') }}" class="brand">
                <span class="brand-icon">🌍</span>
                <span>World Travel Advisory</span>
            </a>
            <nav>
                <a href="{{ url_for('main.home') }}">Home</a>
                <a href="{{ url_for('main.all_advisories_page') }}">All Advisories</a>
                <a href="{{ url_for('main.about_page') }}">About</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>Project Group 2 — Nazanin Amini, Lorie Blount, Michael Hawkins</p>
            <p>Powered by Flask · Deployed on Google Cloud Run</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
