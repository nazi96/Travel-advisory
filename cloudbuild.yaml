# Google Cloud Build pipeline: build container -> push -> deploy to Cloud Run
steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/travel-advisory:latest'
      - '.'
  # 2. Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/travel-advisory'
  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'travel-advisory'
      - '--image=gcr.io/$PROJECT_ID/travel-advisory:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--max-instances=5'

images:
  - 'gcr.io/$PROJECT_ID/travel-advisory:latest'

options:
  logging: CLOUD_LOGGING_ONLY